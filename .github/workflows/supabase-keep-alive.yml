name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 every 3 days to prevent project pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -i -X GET "$SUPABASE_URL/rest/v1/contact_submissions?limit=1" \
          -H "apikey: $SUPABASE_ANON_KEY" \
          -H "Authorization: Bearer $SUPABASE_ANON_KEY"
