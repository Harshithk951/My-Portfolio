version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Ignore major/breaking updates for critical infrastructure to maintain stability
    ignore:
      - dependency-name: "vite"
        versions: [">= 7.0.0"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">= 5.0.0"]
      - dependency-name: "@supabase/supabase-js"
        versions: [">= 2.105.0"]
      - dependency-name: "lucide-react"
        versions: [">= 1.0.0"] # Keep at 0.x to maintain brand icon support or prevent breaking changes
      - dependency-name: "eslint"
        versions: [">= 9.0.0"]
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
